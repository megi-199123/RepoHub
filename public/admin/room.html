<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Host Console — Mystery Box</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#FFF8EE" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/room.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="host-app">
    <header class="host-header">
      <a class="host-back" href="/admin#rooms">← Rooms</a>
      <div class="host-code-block">
        <span class="host-code-label">Room code</span>
        <strong id="host-code" class="host-code">------</strong>
        <span id="host-title" class="host-title"></span>
      </div>
    </header>

    <!-- Addendum A2: two separate links (same room code) — a player seats into the game, a
         watcher only ever gets a view-only board. Shown readably (not just copy buttons) since
         this screen is usually projected. -->
    <div class="host-links">
      <div class="host-link-row">
        <span class="host-link-label">Player link</span>
        <code id="host-player-link" class="host-link-url"></code>
        <button id="copy-player-link" class="btn btn-ghost" type="button">Copy</button>
      </div>
      <div class="host-link-row">
        <span class="host-link-label">Watch link</span>
        <code id="host-watch-link" class="host-link-url"></code>
        <button id="copy-watch-link" class="btn btn-ghost" type="button">Copy</button>
      </div>
    </div>

    <p id="reconnect-banner" class="reconnect-banner" role="status" hidden></p>

    <p id="status-banner" class="status-banner host-status" aria-live="polite">
      <span id="status-text">Connecting…</span>
      <span id="countdown-pill" class="countdown-pill" aria-hidden="true" hidden></span>
    </p>
    <p id="sr-announce" class="sr-only" aria-live="polite"></p>
    <p id="lock-summary" class="host-lock-summary" hidden></p>

    <div class="host-layout">
      <section class="host-board">
        <div class="stage">
          <div id="boxes" class="boxes" role="group" aria-label="Mystery boxes"></div>
        </div>
        <ul id="results-list" class="results-list" hidden></ul>
      </section>

      <aside class="host-panel card">
        <div class="host-panel-section">
          <h2>Players <span id="watching-count" class="host-watching-count" hidden></span></h2>
          <ul id="player-list" class="host-player-list"></ul>
          <p id="player-empty" class="muted small" hidden>No one has joined yet.</p>
        </div>

        <div class="host-panel-section">
          <h2>Controls</h2>
          <label class="switch-row host-switch-row">
            <input id="lock-joins" type="checkbox" class="switch" disabled />
            <span>
              <strong>Lock joins</strong>
              <span class="muted">Stop new players from joining.</span>
            </span>
          </label>

          <!-- Addendum B2 -->
          <label class="switch-row host-switch-row">
            <input id="chat-toggle" type="checkbox" class="switch" disabled />
            <span>
              <strong>Chat</strong>
              <span class="muted">Let players and watchers send messages and reactions.</span>
            </span>
          </label>

          <!-- Addendum A1: box count can change in lobby AND while picking (re-deals and frees
               any lock on a box index that no longer exists) — disabled the rest of the time. -->
          <div class="host-boxcount-row">
            <span class="host-boxcount-label">Boxes</span>
            <button id="btn-boxcount-minus" class="btn btn-ghost host-boxcount-btn" type="button" aria-label="Fewer boxes" disabled>−</button>
            <output id="boxcount-value" class="host-boxcount-value" for="btn-boxcount-minus btn-boxcount-plus">4</output>
            <button id="btn-boxcount-plus" class="btn btn-ghost host-boxcount-btn" type="button" aria-label="More boxes" disabled>+</button>
          </div>

          <div class="host-actions">
            <!-- Disabled by default in markup (not just after the first render): C3 — a host
                 tap before the socket has joined the room used to be silently queued and fire
                 late with no feedback. JS only ever re-enables these once room:state confirms
                 the host is actually in the room. -->
            <button id="btn-start" class="btn btn-primary btn-block" type="button" disabled>Start picking</button>

            <div class="host-countdown-row">
              <input id="countdown-seconds" type="number" min="5" max="120" step="1" value="15" aria-label="Countdown seconds" disabled />
              <button id="btn-countdown" class="btn btn-primary" type="button" disabled>Start countdown</button>
            </div>

            <div class="host-reveal-row">
              <button id="btn-reveal-next" class="btn btn-ghost" type="button" disabled>Reveal next</button>
              <button id="btn-reveal-all" class="btn btn-ghost" type="button" disabled>Reveal all</button>
            </div>

            <button id="btn-close" class="btn btn-danger-ghost btn-block" type="button" disabled>Close room</button>
          </div>
        </div>

        <!-- Addendum B2: the embedded chat core (message list, composer, reactions) is built by
             window.Chat.create({variant:'embedded', mountEl: this}) in admin/room.js — a readable
             side panel for the big screen, with a trash button on each message. -->
        <div class="host-panel-section">
          <h2>Chat</h2>
          <div id="host-chat-mount" class="host-chat-mount"></div>
        </div>
      </aside>
    </div>
  </main>

  <div id="ended-screen" class="takeover" hidden>
    <div class="takeover-card" tabindex="-1">
      <div class="takeover-emoji" aria-hidden="true">🔒</div>
      <h2>Room closed</h2>
      <p>This room has ended.</p>
      <a class="btn-primary small" href="/admin#rooms"><span>Back to Rooms</span></a>
    </div>
  </div>

  <dialog id="confirm-dialog" class="dialog dialog-sm">
    <form method="dialog" class="confirm">
      <h2 id="confirm-title">Are you sure?</h2>
      <p id="confirm-text" class="muted"></p>
      <div class="form-actions">
        <button class="btn btn-ghost" value="cancel">Cancel</button>
        <button class="btn btn-danger" value="ok" id="confirm-ok">Confirm</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="/socket.io/socket.io.min.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/boxes.js"></script>
  <script src="/js/board.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/admin/room.js"></script>
</body>
</html>
