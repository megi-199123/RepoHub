<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mystery Box</title>
  <meta name="theme-color" content="#FFF8EE" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/room.css" />
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="join-page">
    <form id="landing-form" class="card join-card" novalidate>
      <div class="join-logo" aria-hidden="true">🎁</div>
      <h1>Mystery Box</h1>
      <p id="landing-lede" class="muted" aria-live="polite">Enter the 6-digit room code to play.</p>

      <div id="code-step" class="landing-step">
        <div class="otp" id="otp" role="group" aria-label="Room code">
          <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" aria-label="Digit 1" data-i="0" />
          <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" aria-label="Digit 2" data-i="1" />
          <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" aria-label="Digit 3" data-i="2" />
          <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" aria-label="Digit 4" data-i="3" />
          <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" aria-label="Digit 5" data-i="4" />
          <input class="otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" aria-label="Digit 6" data-i="5" />
        </div>
      </div>

      <div id="name-step" class="landing-step" hidden>
        <p class="landing-room-found">
          <span id="found-title" class="landing-room-title"></span>
          <button id="change-code" class="landing-change" type="button">Change code</button>
        </p>
        <label class="field">
          <span>Your name</span>
          <input id="join-name" type="text" maxlength="20" required autocomplete="off" placeholder="e.g. Alex" />
        </label>
        <a id="watch-link" class="landing-watch-link" href="#">Just watch →</a>
      </div>

      <p id="landing-error" class="form-error" role="alert" hidden></p>

      <!-- Shown only when POST /api/rooms/join 409s with canWatch:true (seats full, or the
           game is already revealing/finished) — Addendum A2. -->
      <button id="watch-instead-btn" class="landing-watch-instead" type="button" hidden>Watch instead</button>

      <button id="landing-btn" class="btn-primary btn-block" type="submit">
        <span class="btn-shine" aria-hidden="true"></span>
        <span id="landing-btn-label">Continue</span>
      </button>

      <a class="join-back" href="/admin">Host sign in →</a>
    </form>
  </main>

  <script src="/js/fx.js"></script>
  <script src="/js/landing.js"></script>
</body>
</html>
