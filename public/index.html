<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mystery Box</title>
  <meta name="theme-color" content="#1a0b3d" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <button id="sound-toggle" class="icon-btn sound-toggle" type="button" aria-pressed="true" aria-label="Toggle sound">
    <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <main class="app">
    <header class="hero">
      <div class="badge"><span class="dot"></span> Live prize draw</div>
      <h1 id="title" class="title">Mystery Box</h1>
      <p id="subtitle" class="subtitle"></p>
    </header>

    <section id="lineup" class="lineup" hidden aria-labelledby="lineup-heading">
      <h2 id="lineup-heading" class="lineup-heading">What's inside?</h2>
      <ul id="lineup-list" class="lineup-list"></ul>
    </section>

    <section class="stage" aria-live="polite">
      <p id="hint" class="hint">Loading…</p>
      <div id="boxes" class="boxes" role="group" aria-label="Mystery boxes"></div>
    </section>

    <div class="controls">
      <button id="play" class="btn-primary" type="button" disabled>
        <span class="btn-shine" aria-hidden="true"></span>
        <span id="play-label">Shuffle &amp; Play</span>
      </button>
      <p id="plays-left" class="plays-left" hidden></p>
    </div>
  </main>

  <div id="reveal" class="reveal" hidden>
    <div class="reveal-backdrop"></div>
    <div class="reveal-card" role="dialog" aria-modal="true" aria-labelledby="reveal-title">
      <div class="reveal-rays" aria-hidden="true"></div>
      <p id="reveal-kicker" class="reveal-kicker">You won</p>
      <div id="reveal-art" class="reveal-art"></div>
      <h2 id="reveal-title" class="reveal-title"></h2>
      <p id="reveal-desc" class="reveal-desc"></p>
      <div id="reveal-claim" class="claim" hidden>
        <span class="claim-label">Your claim code</span>
        <button id="claim-code" class="claim-code" type="button" title="Copy code"></button>
        <span class="claim-help">Show this code to our staff to claim your prize.</span>
      </div>
      <button id="reveal-close" class="btn-primary small" type="button">
        <span class="btn-shine" aria-hidden="true"></span>
        <span>See the other boxes</span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="/js/fx.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
